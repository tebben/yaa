<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'"><title>spike</title></head>
<body style="font:14px sans-serif;background:#1d1d20;color:#ddd"><h1>native modules spike</h1><pre id="o"></pre>
<script>
const r = { sandboxed: window.spike.sandboxed, ua: navigator.userAgent, dpr: devicePixelRatio, nodeInRenderer: typeof require !== 'undefined' };
document.getElementById('o').textContent = JSON.stringify(r, null, 2);
requestAnimationFrame(() => requestAnimationFrame(() => window.spike.report(r)));
</script></body></html>

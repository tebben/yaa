<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>yaa mark: the y as a merge graph</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span style="display:inline-flex;width:{{px}}px;height:{{px}}px"><svg viewBox="0 0 24 24" width="{{px}}" height="{{px}}" fill="none" role="img" aria-label="yaa mark"><path d="M6.00 5.00L12.00 12.00M16.44 6.82L4.63 20.60" stroke="{{fg}}" stroke-width="2" stroke-linecap="round"/><circle cx="6" cy="5" r="2.8" fill="{{fg}}"/><circle cx="18" cy="5" r="2.05" stroke="{{accent}}" stroke-width="1.5"/></svg></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":24},"color":{"editor":"color","default":"#d4d7dd"},"accent":{"editor":"color","default":"#8fa0e8"},"ground":{"editor":"color","default":"#101113"},"$preview":{"width":24,"height":24}}'>
class Component extends DCLogic {
renderVals() {
return { px: Number(this.props.size) || 24, fg: this.props.color ?? '#d4d7dd', accent: this.props.accent ?? '#8fa0e8', bg: this.props.ground ?? '#101113' };
}
}
</script>
</body>

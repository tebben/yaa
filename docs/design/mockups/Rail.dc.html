<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Right rail: panel toggles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width:40px;height:900px;box-sizing:border-box;flex:none;background:#101113;border-left:1px solid #23252a;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0">
<sc-for list="{{rail}}" as="r" hint-placeholder-count="7">
<span style="width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;background:{{r.bg}};color:{{r.c}}"><dc-import name="Icon" icon="{{r.icon}}" size="16" hint-size="16px,16px"></dc-import></span>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"on":{"editor":"text","default":"changes,chat,terminal"},"$preview":{"width":40,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const active = (this.props.on ?? 'changes,chat,terminal').split(',');
const rail = ['files', 'changes', 'chat', 'terminal', 'review', 'dollar', 'zap'].map((icon) => {
const on = active.includes(icon);
return { icon, bg: on ? '#1b1d22' : 'transparent', c: on ? '#d4d7dd' : '#868c97' };
});
return { rail };
}
}
</script>
</body>
</html>
